[package]
name = "tabadul-desktop"
version = "1.0.0"
description = "تطبيق تبادل - نسخة سطح المكتب"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "tabadul-desktop"
path = "src/main.rs"
